<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial;
            background: #eaf2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login {
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px #aaa;
        }
        input, button {
            display: block;
            padding: 12px;
            margin: 12px auto;
            width: 220px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login">
        <h2>Welcome Back</h2>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button onclick="alert('Login button clicked!')">Login</button>
    </div>
</body>
</html>
